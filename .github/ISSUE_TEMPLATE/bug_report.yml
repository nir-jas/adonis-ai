name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Adonis AI. Please remove credentials and sensitive prompt content from all examples and logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
      placeholder: Describe the actual and expected behavior.
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: 0.1.0-alpha.0
    validations:
      required: true
  - type: input
    id: adonis_version
    attributes:
      label: AdonisJS version
      placeholder: 7.x
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: 24.x
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI
        - Anthropic
        - Fake/testing
        - Custom/community adapter
        - Not provider-specific
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a minimal repository or include minimal code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include a sanitized stack trace or normalized error when available.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed API keys, credentials, and sensitive prompt content.
          required: true
