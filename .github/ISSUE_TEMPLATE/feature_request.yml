name: Feature request
description: Propose an addition to the Adonis AI SDK
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem should the SDK solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed API
      description: Show the developer experience you would like, if possible.
  - type: textarea
    attributes:
      label: Alternatives
      description: What workarounds or other designs have you considered?
