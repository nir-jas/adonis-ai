name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HOST: 127.0.0.1
  PORT: 3333
  LOG_LEVEL: info
  APP_KEY: ci-test-key-0123456789abcdefghij
  APP_URL: http://127.0.0.1:3333
  SESSION_DRIVER: memory

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:package-consumer
